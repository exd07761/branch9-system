<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Docket Management System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316233A%22/%3E%3Cline%20x1%3D%2232%22%20y1%3D%2212%22%20x2%3D%2232%22%20y2%3D%2248%22%20stroke%3D%22%23A9802E%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3Cline%20x1%3D%2215%22%20y1%3D%2220%22%20x2%3D%2249%22%20y2%3D%2220%22%20stroke%3D%22%23A9802E%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%2228%22%20r%3D%226%22%20fill%3D%22none%22%20stroke%3D%22%23A9802E%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2249%22%20cy%3D%2228%22%20r%3D%226%22%20fill%3D%22none%22%20stroke%3D%22%23A9802E%22%20stroke-width%3D%223%22/%3E%3Cline%20x1%3D%2221%22%20y1%3D%2250%22%20x2%3D%2243%22%20y2%3D%2250%22%20stroke%3D%22%23A9802E%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=0.9.9">
</head>
<body>

  <div class="login-shell">
    <main class="wrap wrap-narrow" style="padding-top: 0; padding-bottom: 0;">
      <header class="header">
        <p class="eyebrow">Regional Trial Court &middot; Docket Management System</p>
        <h1>Branch Clerk Log In</h1>
        <p class="sub">Sign in with your court-issued account to access the docket.</p>
      </header>

      <section class="card">
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>

          <p class="form-error" id="loginError" role="alert"></p>

          <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
        </form>
      </section>

      <p class="footnote">This is an internal system. Access is limited to authorized court personnel.</p>
    </main>
  </div>

  <script type="module" src="js/login.js?v=0.9.9"></script>

</body>
</html>
